<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Axes -->
  <path d="M 10 10 L 10 90 L 90 90" 
        stroke="#666666" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Area fill under the plot -->
  <path d="M 10 90 L 20 30 L 40 75 L 55 45 L 70 75 L 90 30 L 90 90 Z" 
        fill="#3b82f6" 
        fill-opacity="0.2" />

  <!-- W plot line -->
  <path d="M 20 30 L 40 75 L 55 45 L 70 75 L 90 30" 
        stroke="#3b82f6" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
        
  <!-- Data points -->
  <circle cx="20" cy="30" r="5" fill="#3b82f6" />
  <circle cx="40" cy="75" r="5" fill="#3b82f6" />
  <circle cx="55" cy="45" r="5" fill="#3b82f6" />
  <circle cx="70" cy="75" r="5" fill="#3b82f6" />
  <circle cx="90" cy="30" r="5" fill="#3b82f6" />
</svg>
